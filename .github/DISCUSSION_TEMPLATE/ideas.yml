title: "[Idea] "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should Global Design Skill support next?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Who would use it and in which workflow?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Desired output
      description: What should the AI assistant produce?
    validations:
      required: false

