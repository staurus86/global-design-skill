name: Deploy Demo Gallery to GitHub Pages

on:
  push:
    branches: ["master"]
    paths: ["demo/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload demo/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
